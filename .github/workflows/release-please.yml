name: Release

# Conventional-commit-driven releases, on demand (NOT one release per commit).
#
# On each push to `main`, release-please opens/updates a single "release PR"
# that accumulates changes and computes the next SemVer version from the
# conventional commit subjects (which the squash-merge PR-title check keeps
# valid). Nothing is released until a maintainer merges that release PR — which
# then tags the version, updates package.json + CHANGELOG.md, and cuts a
# GitHub Release. The tag-aware container workflow is then dispatched at that
# tag to publish the frontend image and attach its validated self-hosting
# release manifest to the release.
on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Config lives in release-please-config.json + .release-please-manifest.json
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Tags created with GITHUB_TOKEN do not recursively trigger push
      # workflows. workflow_dispatch is the supported exception, so explicitly
      # run the existing tag-aware image workflow after Release Please creates
      # the tag and GitHub Release.
      - name: Publish the coordinated self-hosting release bundle
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run container-image.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
