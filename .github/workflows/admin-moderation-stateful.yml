name: Stateful admin moderation

# This suite exercises the complete browser -> GraphQL -> Neo4j path. Keep it
# separate from the fast mocked suite, and run it on PRs as well as regularly
# against the immutable backend revision that produced the frontend schema pin.
# A companion draft backend may be tested here without merging or deploying it.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 2' # weekly, Tuesdays 07:00 UTC

permissions:
  contents: read

concurrency:
  group: stateful-admin-moderation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-moderation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve pinned backend
        id: backend
        run: node scripts/stateful-backend-contract.mjs

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: gennit-project/multiforum-backend
          ref: ${{ steps.backend.outputs.revision }}
          path: .stateful/gennit-backend
          persist-credentials: false

      - name: Verify backend checkout provenance
        run: node scripts/stateful-backend-contract.mjs --verify-checkout .stateful/gennit-backend

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            .stateful/gennit-backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify schema pin and stateful checkout tooling
        run: |
          pnpm run schema:check
          node --test scripts/stateful-backend-contract.test.mjs

      - name: Install backend dependencies
        # The backend is checked out beneath the frontend workspace. Without
        # this flag pnpm discovers the parent's pnpm-workspace.yaml and
        # reinstalls the frontend instead of creating backend/node_modules.
        run: pnpm --dir .stateful/gennit-backend install --ignore-workspace --frozen-lockfile

      - name: Start test Neo4j
        run: pnpm run playwright:neo4j:up

      - name: Build backend
        run: pnpm --dir .stateful/gennit-backend run build

      - name: Build frontend for Playwright
        run: pnpm run build:playwright:mocked

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-stack admin moderation suite
        env:
          PLAYWRIGHT_BACKEND_CWD: ${{ github.workspace }}/.stateful/gennit-backend
          PLAYWRIGHT_USE_BUILT_FRONTEND: 'true'
        run: pnpm run test:playwright:stateful:admin

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-moderation-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Stop test Neo4j
        if: always()
        run: pnpm run playwright:neo4j:down
