name: Self-hosting deployment contract

on:
  pull_request:
    branches:
      - main
    paths:
      - '.env.quickstart.example'
      - '.env.production.example'
      - '.github/workflows/container-image.yml'
      - '.github/workflows/self-hosting-contract.yml'
      - 'deploy/caddy/**'
      - 'deploy/releases/**'
      - 'deploy/systemd/**'
      - 'deploy/terraform/aws-single-vm/**'
      - 'docker-compose*.yml'
      - 'scripts/backup-self-hosting.sh'
      - 'scripts/check-self-hosting-backups.sh'
      - 'scripts/create-self-hosting-release-manifest.sh'
      - 'scripts/prepare-self-hosting-upgrade.sh'
      - 'scripts/promote-self-hosting-upgrade.sh'
      - 'scripts/restore-self-hosting.sh'
      - 'scripts/smoke-self-hosting-release.sh'
      - 'scripts/validate-self-hosting-release.sh'
      - 'scripts/upload-self-hosting-backup.sh'
      - 'scripts/upgrade-self-hosting.sh'
      - 'scripts/verify-self-hosting.sh'
      - 'scripts/self-hosting-tests/**'
      - 'scripts/validate-self-hosting-contract.sh'
  push:
    branches:
      - main
    paths:
      - '.env.quickstart.example'
      - '.env.production.example'
      - '.github/workflows/container-image.yml'
      - '.github/workflows/self-hosting-contract.yml'
      - 'deploy/caddy/**'
      - 'deploy/releases/**'
      - 'deploy/systemd/**'
      - 'deploy/terraform/aws-single-vm/**'
      - 'docker-compose*.yml'
      - 'scripts/backup-self-hosting.sh'
      - 'scripts/check-self-hosting-backups.sh'
      - 'scripts/create-self-hosting-release-manifest.sh'
      - 'scripts/prepare-self-hosting-upgrade.sh'
      - 'scripts/promote-self-hosting-upgrade.sh'
      - 'scripts/restore-self-hosting.sh'
      - 'scripts/smoke-self-hosting-release.sh'
      - 'scripts/validate-self-hosting-release.sh'
      - 'scripts/upload-self-hosting-backup.sh'
      - 'scripts/upgrade-self-hosting.sh'
      - 'scripts/verify-self-hosting.sh'
      - 'scripts/self-hosting-tests/**'
      - 'scripts/validate-self-hosting-contract.sh'
  workflow_dispatch:

concurrency:
  group: self-hosting-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Restic
        run: |
          sudo apt-get update
          sudo apt-get install --yes restic

      - name: Validate self-hosting deployment contract
        env:
          MULTIFORUM_REQUIRE_RESTIC_INTEGRATION: 'true'
        run: scripts/validate-self-hosting-contract.sh
